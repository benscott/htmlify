[project]
name = "htmlify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4==4.12.3",
    "luigi==3.5.2",
    "mysql-connector-python==9.0.0",
    "pandas>=3.0.1",
    "phpserialize==1.3",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "requests==2.32.3",
    "requests-cache==1.2.1",
    "selenium==4.22.0",
    "typer>=0.17.6",
    "click>=8.3,<8.4",    
]

[project.urls]
"Homepage" = "https://github.com/benscott/htmlify"

[project.scripts]
htmlify = "htmlify.cli:cli"

[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=6.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["htmlify"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = false 
